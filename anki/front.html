<!-- Lapis-compatible front template for Bee's Ultimate Kanji Dictionary.
     Minimal and field-driven; no scripts, no framework. -->
<div class="bee-card bee-front" lang="ja">
  <div class="bee-word">{{Word}}</div>
  {{#WordReading}}<div class="bee-reading">{{WordReading}}</div>{{/WordReading}}
  {{#Sentence}}<div class="bee-sentence">{{cloze:Sentence}}</div>{{/Sentence}}
</div>
