name: release

# One acquisition per UTC day. Also runnable on demand for verification.
on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write          # commit dist/index.json + publish releases

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Resolve UTC acquisition date
        id: date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore same-day acquisition cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            cache/
            kanjivg-cache/
            kanjidic2-cache/
          key: daily-cache-v1-${{ steps.date.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: daily-cache-v1-${{ steps.date.outputs.date }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest==9.1.1
          npm ci

      - name: Run tests
        run: python -m pytest -q

      - name: Build dictionary
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          revision="$(python -c 'import json;print(json.load(open("dist/index.json"))["revision"])')"
          release_tag="v$revision"
          release_draft="$(gh release view "$release_tag" --json isDraft --jq .isDraft 2>/dev/null || true)"
          release_immutable="$(gh api --jq .immutable "repos/${GITHUB_REPOSITORY}/releases/tags/$release_tag" 2>/dev/null || true)"
          latest_tag="$(gh api --jq .tag_name "repos/${GITHUB_REPOSITORY}/releases/latest" 2>/dev/null || true)"
          asset_names="$(gh release view "$release_tag" --json assets --jq '[.assets[].name] | sort | join(" ")' 2>/dev/null || true)"
          force_fresh=false
          if [ -z "$release_draft" ]; then
            force_fresh=true
          elif [ "$release_draft" = "true" ]; then
            gh release delete "$release_tag" --yes --cleanup-tag
            force_fresh=true
          elif [ "$release_draft" = "false" ] && { [ "$release_immutable" != "true" ] || [ "$latest_tag" != "$release_tag" ] || [ "$asset_names" != "MANIFEST.json SHA256SUMS bees-ultimate-kanji-dictionary.zip" ]; }; then
            force_fresh=true
          fi
          if [ "$force_fresh" = "true" ]; then
            # Never trust bytes or checksums from a mutable/draft release. Removing
            # only the comparison hash forces a fresh revision from cached sources.
            rm -f dist/content.sha256
          fi
          python -m bees_kanji --cache cache --out build --dist dist
          echo "recovery=false" >> "$GITHUB_OUTPUT"

      - name: Save resumable acquisition cache
        if: always()
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            cache/
            kanjivg-cache/
            kanjidic2-cache/
          key: daily-cache-v1-${{ steps.date.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Check for a new release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f build/bees-ultimate-kanji-dictionary.zip ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "recovery=${{ steps.build.outputs.recovery }}" >> "$GITHUB_OUTPUT"
            echo "revision=$(python -c 'import json;print(json.load(open("dist/index.json"))["revision"])')" >> "$GITHUB_OUTPUT"
          else
            revision="$(python -c 'import json;print(json.load(open("dist/index.json"))["revision"])')"
            release_tag="v$revision"
            release_draft="$(gh release view "$release_tag" --json isDraft --jq .isDraft 2>/dev/null || true)"
            remote_tag_commit="$(git ls-remote origin "refs/tags/$release_tag" | cut -f1)"
            release_immutable="$(gh api --jq .immutable "repos/${GITHUB_REPOSITORY}/releases/tags/$release_tag" 2>/dev/null || true)"
            latest_tag="$(gh api --jq .tag_name "repos/${GITHUB_REPOSITORY}/releases/latest" 2>/dev/null || true)"
            asset_names="$(gh release view "$release_tag" --json assets --jq '[.assets[].name] | sort | join(" ")' 2>/dev/null || true)"
            test "$release_draft" = "false"
            test "$release_immutable" = "true"
            test "$latest_tag" = "$release_tag"
            test "$asset_names" = "MANIFEST.json SHA256SUMS bees-ultimate-kanji-dictionary.zip"
            mkdir -p verify-existing
            gh release download "$release_tag" --pattern MANIFEST.json --dir verify-existing
            manifest_code_revision="$(python -c 'import json;print(json.load(open("verify-existing/MANIFEST.json"))["codeRevision"])')"
            manifest_revision="$(python -c 'import json;print(json.load(open("verify-existing/MANIFEST.json"))["revision"])')"
            test "$remote_tag_commit" = "$manifest_code_revision"
            test "$manifest_revision" = "$revision"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "recovery=false" >> "$GITHUB_OUTPUT"
            echo "No content change; nothing to publish."
          fi

      - name: Prepare updater commit
        if: steps.check.outputs.publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/index.json dist/content.sha256
          if ! git diff --cached --quiet; then
            export GIT_AUTHOR_DATE="${{ steps.date.outputs.date }}T00:00:00Z"
            export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
            git commit -m "chore: publish revision ${{ steps.check.outputs.revision }}"
          fi

      - name: Bind artifacts to final commit
        if: steps.check.outputs.publish == 'true'
        run: |
          expected_commit="$(git rev-parse HEAD)"
          python -c 'import pathlib,sys; from bees_kanji import bind_release_artifacts_to_code_revision; bind_release_artifacts_to_code_revision(pathlib.Path("build"), sys.argv[1])' "$expected_commit"

      - name: Publish release
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="v${{ steps.check.outputs.revision }}"
          expected_commit="$(git rev-parse HEAD)"
          if [ "${{ steps.check.outputs.recovery }}" != "true" ] && [ "$(gh release view "$release_tag" --json isDraft --jq .isDraft 2>/dev/null || true)" = "true" ]; then
            gh release delete "$release_tag" --yes --cleanup-tag
            git tag -d "$release_tag" 2>/dev/null || true
          fi
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$release_tag" >/dev/null
          tag_status=$?
          set -e
          if [ "$tag_status" -eq 0 ]; then
            remote_tag_commit="$(git ls-remote origin "refs/tags/$release_tag" | cut -f1)"
            if [ "$remote_tag_commit" != "$expected_commit" ]; then
              test "$(gh release view "$release_tag" --json isDraft --jq .isDraft)" = "true"
              gh release delete "$release_tag" --yes --cleanup-tag
              tag_status=2
            else
              test "$remote_tag_commit" = "$expected_commit"
            fi
          fi
          if [ "$tag_status" -ne 0 ]; then
            test "$tag_status" -eq 2
            git tag "$release_tag" "$expected_commit"
            git push origin "refs/tags/$release_tag:refs/tags/$release_tag"
          fi
          create_draft_release() {
            gh release create "$release_tag" \
              build/bees-ultimate-kanji-dictionary.zip \
              build/MANIFEST.json \
              build/SHA256SUMS \
              --draft \
              --verify-tag \
              --title "Bee's Ultimate Kanji Dictionary ${{ steps.check.outputs.revision }}" \
              --notes "Revision ${{ steps.check.outputs.revision }}. Import the ZIP in Yomitan (self-updating). Verify with SHA256SUMS; MANIFEST.json records the source/revision provenance. Bundled licences: LICENSE-data.txt (JMdict/KANJIDIC via Jiten, CC BY-SA) and LICENSE-kanjivg.txt (KanjiVG, CC BY-SA)."
          }
          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            create_draft_release
          else
            release_draft="$(gh release view "$release_tag" --json isDraft --jq .isDraft)"
            release_immutable="$(gh api --jq .immutable "repos/${GITHUB_REPOSITORY}/releases/tags/$release_tag")"
            if [ "$release_draft" = "true" ]; then
              gh release upload "$release_tag" \
                build/bees-ultimate-kanji-dictionary.zip \
                build/MANIFEST.json \
                build/SHA256SUMS \
                --clobber
            elif [ "$release_immutable" != "true" ]; then
              gh release delete "$release_tag" --yes
              create_draft_release
            else
              echo "Cannot replace incomplete immutable release $release_tag; fix forward with a fresh revision." >&2
              exit 1
            fi
          fi

      - name: Verify published assets
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="v${{ steps.check.outputs.revision }}"
          expected_commit="$(git rev-parse HEAD)"
          git fetch --force origin "refs/tags/$release_tag:refs/tags/$release_tag"
          tag_commit="$(git rev-list -n 1 "$release_tag")"
          test "$tag_commit" = "$expected_commit"
          mkdir -p verify
          gh release download "$release_tag" --dir verify --clobber
          asset_names="$(gh release view "$release_tag" --json assets --jq '[.assets[].name] | sort | join(" ")')"
          test "$asset_names" = "MANIFEST.json SHA256SUMS bees-ultimate-kanji-dictionary.zip"
          (cd verify && sha256sum -c SHA256SUMS)
          node scripts/validate_yomitan.mjs verify/bees-ultimate-kanji-dictionary.zip
          # the standalone manifest asset must match the copy bundled in the ZIP
          python -c "import zipfile,sys; b=zipfile.ZipFile('verify/bees-ultimate-kanji-dictionary.zip').read('MANIFEST.json'); s=open('verify/MANIFEST.json','rb').read(); sys.exit(0 if b==s else 'MANIFEST.json mismatch')"
          python -c "import json,sys,zipfile; manifest=json.load(open('verify/MANIFEST.json')); index=json.loads(zipfile.ZipFile('verify/bees-ultimate-kanji-dictionary.zip').read('index.json')); expected_commit,expected_revision=sys.argv[1:]; assert manifest['codeRevision'] == expected_commit; assert manifest['revision'] == expected_revision; assert index['revision'] == expected_revision" "$expected_commit" "${{ steps.check.outputs.revision }}"
          for asset in bees-ultimate-kanji-dictionary.zip MANIFEST.json SHA256SUMS; do
            cmp "build/$asset" "verify/$asset"
          done

      - name: Publish verified updater commit
        if: steps.check.outputs.publish == 'true'
        run: |
          expected_commit="$(git rev-parse HEAD)"
          git push origin "HEAD:main"
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_main" = "$expected_commit"

      - name: Publish verified immutable release
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="v${{ steps.check.outputs.revision }}"
          immutable="$(gh api --jq '.immutable' "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" 2>/dev/null || echo false)"
          if [ "$immutable" != "true" ]; then
            gh release edit "$release_tag" --draft=false --latest
          fi
          immutable="$(gh api --jq '.immutable' \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}")"
          test "$immutable" = "true"
          latest_tag="$(gh api --jq '.tag_name' \
            "repos/${GITHUB_REPOSITORY}/releases/latest")"
          test "$latest_tag" = "$release_tag"
          asset_names="$(gh api --jq '[.assets[].name] | sort | join(" ")' \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}")"
          test "$asset_names" = "MANIFEST.json SHA256SUMS bees-ultimate-kanji-dictionary.zip"
          remote_tag_commit="$(git ls-remote origin "refs/tags/$release_tag" | cut -f1)"
          expected_commit="$(git rev-parse HEAD)"
          test "$remote_tag_commit" = "$expected_commit"
          mkdir -p verify-published
          gh release download "$release_tag" --dir verify-published --clobber
          (cd verify-published && sha256sum -c SHA256SUMS)
          for asset in bees-ultimate-kanji-dictionary.zip MANIFEST.json SHA256SUMS; do
            cmp "build/$asset" "verify-published/$asset"
          done
