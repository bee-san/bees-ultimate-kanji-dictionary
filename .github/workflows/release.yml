name: release

# One acquisition per UTC day. Also runnable on demand for verification.
on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write          # commit dist/index.json + publish releases

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . jsonschema pytest
          npm ci

      - name: Run tests
        run: python -m pytest -q

      - name: Build dictionary
        run: python -m bees_kanji --cache cache --out build --dist dist

      - name: Check for a new release
        id: check
        run: |
          if [ -f build/bees-ultimate-kanji-dictionary.zip ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "revision=$(python -c 'import json;print(json.load(open("dist/index.json"))["revision"])')" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No content change; nothing to publish."
          fi

      - name: Commit updated updater index
        if: steps.check.outputs.publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/index.json dist/content.sha256
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish revision ${{ steps.check.outputs.revision }}"
            git push
          fi

      - name: Publish release
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "latest" --yes --cleanup-tag || true
          gh release create "latest" \
            build/bees-ultimate-kanji-dictionary.zip \
            build/SHA256SUMS \
            --title "Bee's Ultimate Kanji Dictionary ${{ steps.check.outputs.revision }}" \
            --notes "Revision ${{ steps.check.outputs.revision }}. Import the ZIP in Yomitan; verify with SHA256SUMS."

      - name: Verify published asset hash
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p verify
          gh release download "latest" --dir verify --clobber
          (cd verify && sha256sum -c SHA256SUMS)
          node scripts/validate_yomitan.mjs verify/bees-ultimate-kanji-dictionary.zip
