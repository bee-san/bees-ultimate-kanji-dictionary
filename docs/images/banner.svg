<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Bee's Ultimate Kanji Dictionary — a beginner-friendly Jiten-to-Yomitan kanji dictionary">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f33"/>
      <stop offset="1" stop-color="#123a5e"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0072b2"/>
      <stop offset="1" stop-color="#d55e00"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <!-- Reading-distribution donut motif: the project's signature learning aid -->
  <g transform="translate(310 320)">
    <circle r="150" fill="none" stroke="url(#ring)" stroke-width="42"/>
    <!-- On/Kun split arc accent (Okabe-Ito palette, colourblind-safe) -->
    <path d="M0 -150 A150 150 0 0 1 129.9 75" fill="none" stroke="#0072b2" stroke-width="42" stroke-linecap="butt"/>
    <text x="0" y="60" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="200" font-weight="700" fill="#f5f7fa" text-anchor="middle" lang="ja">場</text>
  </g>
  <!-- Wordmark + slogan -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="560" y="270" font-size="66" font-weight="800" fill="#ffffff">Bee's Ultimate</text>
    <text x="560" y="346" font-size="66" font-weight="800" fill="#ffffff">Kanji Dictionary</text>
    <text x="562" y="410" font-size="31" font-weight="500" fill="#9fc4e4">A beginner-friendly kanji dictionary for Yomitan,</text>
    <text x="562" y="450" font-size="31" font-weight="500" fill="#9fc4e4">built from Jiten data — one click to import.</text>
    <g transform="translate(562 500)">
      <rect x="0" y="0" width="235" height="46" rx="8" fill="#0072b2"/>
      <text x="117" y="31" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Download ZIP</text>
      <text x="255" y="31" font-size="22" font-weight="500" fill="#9fc4e4">· self-updating · MIT + CC BY-SA</text>
    </g>
  </g>
</svg>
