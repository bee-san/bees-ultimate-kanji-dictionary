[project]
name = "bees-ultimate-kanji-dictionary"
version = "0.0.0"
description = "Minimal Jiten -> Yomitan kanji dictionary generator"
requires-python = ">=3.11"
dependencies = ["jsonschema==4.26.0"]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
